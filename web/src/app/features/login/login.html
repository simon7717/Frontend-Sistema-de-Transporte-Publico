<div class="login-page">
  <mat-card class="login-card">
    <mat-card-header class="login-card__header">
      <div mat-card-avatar class="login-card__avatar">
        <mat-icon>directions_bus</mat-icon>
      </div>
      <mat-card-title>Sistema de Transporte Público</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      @if (loading()) {
        <p class="login-card__hint">Cargando…</p>
      } @else if (showFirstUser()) {
        <p class="login-card__subtitle">Cree el primer usuario administrador</p>
        <div [formGroup]="firstUserForm" class="login-card__fields">
          <mat-form-field appearance="outline">
            <mat-label>Nombre de usuario</mat-label>
            <input matInput formControlName="nombre_usuario" autocomplete="username" />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Contraseña</mat-label>
            <input
              matInput
              type="password"
              formControlName="contrasena"
              autocomplete="new-password"
            />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Rol</mat-label>
            <input matInput formControlName="rol" />
          </mat-form-field>
          <button
            mat-raised-button
            color="primary"
            type="button"
            [disabled]="firstUserForm.invalid"
            (click)="onCreateFirstUser()"
          >
            Crear usuario
          </button>
        </div>
      } @else {
        <p class="login-card__subtitle">Inicie sesión</p>
        <div [formGroup]="loginForm" class="login-card__fields">
          <mat-form-field appearance="outline">
            <mat-label>Nombre de usuario</mat-label>
            <input matInput formControlName="nombre_usuario" autocomplete="username" />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Contraseña</mat-label>
            <input
              matInput
              type="password"
              formControlName="contrasena"
              autocomplete="current-password"
            />
          </mat-form-field>
          <button
            mat-raised-button
            color="primary"
            type="button"
            [disabled]="loginForm.invalid"
            (click)="onLogin()"
          >
            Entrar
          </button>
        </div>
      }
    </mat-card-content>
  </mat-card>
</div>

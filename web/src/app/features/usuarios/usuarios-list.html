<section class="page">
  <div class="page-header">
    <h2>Usuarios</h2>
    <button mat-raised-button color="primary" type="button" (click)="openCreate()">
      <mat-icon>add</mat-icon>
      Nuevo
    </button>
  </div>

  @if (loading()) {
    <div class="loader"><mat-spinner diameter="40" /></div>
  } @else {
    @if (usuarios().length === 0) {
      <div class="empty-state">
        <mat-icon class="empty-state__icon">people</mat-icon>
        <p class="empty-state__title">No hay usuarios registrados aún</p>
        <p class="empty-state__text">Crea el primero para empezar.</p>
        <button mat-raised-button color="primary" type="button" (click)="openCreate()">
          Crear primero
        </button>
      </div>
    } @else {
      <div class="table-container">
        <table mat-table [dataSource]="usuarios()" class="table">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let row">{{ asShortId(row.id_usuario) }}</td>
      </ng-container>

      <ng-container matColumnDef="nombre_usuario">
        <th mat-header-cell *matHeaderCellDef>Usuario</th>
        <td mat-cell *matCellDef="let row">{{ row.nombre_usuario }}</td>
      </ng-container>

      <ng-container matColumnDef="rol">
        <th mat-header-cell *matHeaderCellDef>Rol</th>
        <td mat-cell *matCellDef="let row">{{ row.rol }}</td>
      </ng-container>

      <ng-container matColumnDef="activo">
        <th mat-header-cell *matHeaderCellDef>Activo</th>
        <td mat-cell *matCellDef="let row">
          <mat-chip [class.chip-activo]="row.activo" [class.chip-inactivo]="!row.activo">
            {{ row.activo ? 'Sí' : 'No' }}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button type="button" (click)="openEdit(row)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button type="button" (click)="confirmDelete(row)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </div>
    }
  }
</section>

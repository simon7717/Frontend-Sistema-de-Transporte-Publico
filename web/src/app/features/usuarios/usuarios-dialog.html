<h2 mat-dialog-title>
  {{ data.mode === 'create' ? 'Nuevo usuario' : 'Editar usuario' }}
</h2>

<mat-dialog-content>
  <div class="dialog-form">
    <mat-form-field appearance="outline">
      <mat-label>Nombre de usuario</mat-label>
      <input matInput [formControl]="form.controls.nombre_usuario" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Contraseña</mat-label>
      <input
        matInput
        [type]="hidePassword ? 'password' : 'text'"
        [formControl]="form.controls.contrasena"
      />
      <button
        mat-icon-button
        matSuffix
        type="button"
        [attr.aria-label]="hidePassword ? 'Mostrar contraseña' : 'Ocultar contraseña'"
        (click)="hidePassword = !hidePassword"
      >
        <mat-icon>{{ hidePassword ? 'visibility' : 'visibility_off' }}</mat-icon>
      </button>
      @if (data.mode === 'create' && form.controls.contrasena.touched && form.controls.contrasena.hasError('minlength')) {
        <mat-error>La contraseña debe tener al menos 6 caracteres.</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Rol</mat-label>
      <input matInput [formControl]="form.controls.rol" />
    </mat-form-field>

    <mat-slide-toggle [formControl]="form.controls.activo">
      Usuario activo
    </mat-slide-toggle>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button mat-dialog-close type="button">Cancelar</button>
  <button mat-raised-button color="primary" type="button" (click)="save()">
    Guardar
  </button>
</mat-dialog-actions>

<h2 mat-dialog-title>
  {{ data.mode === 'create' ? 'Nueva tarjeta' : 'Editar tarjeta' }}
</h2>

<mat-dialog-content>
  <div class="dialog-form">
    @if (data.mode === 'create') {
      <mat-form-field appearance="outline">
        <mat-label>Usuario dueño</mat-label>
        <mat-select [formControl]="form.controls.id_usuario">
          @for (u of usuarios; track u.id_usuario) {
            <mat-option [value]="u.id_usuario">
              {{ u.nombre_usuario }} ({{ u.rol }})
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
    }

    <mat-form-field appearance="outline">
      <mat-label>Saldo</mat-label>
      <input matInput type="number" [formControl]="form.controls.saldo" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Tipo</mat-label>
      <input matInput [formControl]="form.controls.tipo" />
    </mat-form-field>

    <mat-slide-toggle [formControl]="form.controls.activo">Tarjeta activa</mat-slide-toggle>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button mat-dialog-close type="button">Cancelar</button>
  <button mat-raised-button color="primary" type="button" (click)="save()">
    Guardar
  </button>
</mat-dialog-actions>

<section class="page">
  <div class="page-header">
    <div class="page-header__left">
      <h2>Rutas</h2>
      <mat-button-toggle-group
        [value]="filterMode()"
        (change)="setFilterMode($event.value)"
        aria-label="Filtro de rutas"
      >
        <mat-button-toggle value="todas">Todas</mat-button-toggle>
        <mat-button-toggle value="activas">Solo activas</mat-button-toggle>
      </mat-button-toggle-group>
    </div>

    <button mat-raised-button color="primary" type="button" (click)="openCreate()">
      <mat-icon>add</mat-icon>
      Nuevo
    </button>
  </div>

  @if (loading()) {
    <div class="loader"><mat-spinner diameter="40" /></div>
  } @else {
    @if (rutas().length === 0) {
      <div class="empty-state">
        <mat-icon class="empty-state__icon">route</mat-icon>
        <p class="empty-state__title">No hay rutas registradas aún</p>
        <p class="empty-state__text">Crea la primera para empezar.</p>
        <button mat-raised-button color="primary" type="button" (click)="openCreate()">
          Crear primero
        </button>
      </div>
    } @else {
      <div class="table-container">
        <table mat-table [dataSource]="rutas()" class="table">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let row">{{ asShortId(row.id_ruta) }}</td>
      </ng-container>

      <ng-container matColumnDef="codigo">
        <th mat-header-cell *matHeaderCellDef>Código</th>
        <td mat-cell *matCellDef="let row">{{ row.codigo }}</td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let row">{{ row.nombre || '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="activo">
        <th mat-header-cell *matHeaderCellDef>Activo</th>
        <td mat-cell *matCellDef="let row">
          <mat-chip [class.chip-activo]="row.activo" [class.chip-inactivo]="!row.activo">
            {{ row.activo ? 'Sí' : 'No' }}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button type="button" (click)="openEdit(row)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button type="button" (click)="confirmDelete(row)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </div>
    }
  }
</section>

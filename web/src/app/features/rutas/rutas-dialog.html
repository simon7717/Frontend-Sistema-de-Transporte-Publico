<h2 mat-dialog-title>
  {{ data.mode === 'create' ? 'Nueva ruta' : 'Editar ruta' }}
</h2>

<mat-dialog-content>
  <div class="dialog-form">
    <mat-form-field appearance="outline">
      <mat-label>Código</mat-label>
      <input matInput [formControl]="form.controls.codigo" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput [formControl]="form.controls.nombre" />
    </mat-form-field>

    <mat-slide-toggle [formControl]="form.controls.activo">Ruta activa</mat-slide-toggle>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button mat-dialog-close type="button">Cancelar</button>
  <button mat-raised-button color="primary" type="button" (click)="save()">
    Guardar
  </button>
</mat-dialog-actions>

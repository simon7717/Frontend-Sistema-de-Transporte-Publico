<h2 mat-dialog-title>{{ data.titulo }}</h2>

<mat-dialog-content>
  {{ data.mensaje }}
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button mat-dialog-close="false" type="button">
    Cancelar
  </button>
  <button mat-raised-button color="warn" [mat-dialog-close]="true" type="button">
    {{ data.textoConfirmar }}
  </button>
</mat-dialog-actions>
